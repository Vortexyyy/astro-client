name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod:
    name: Mod (Minecraft 1.21.1, 1.21.10, 1.21.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build every version
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: astro-mod-jars
          path: mod/versions/*/build/libs/*.jar
          if-no-files-found: error

  launcher:
    name: Launcher (typecheck and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
      - run: npm run build
