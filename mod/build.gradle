plugins {
    id 'fabric-loom' version "${loom_version}" apply false
}

subprojects {
    apply plugin: 'fabric-loom'

    version = "${rootProject.mod_version}+mc${project.minecraft_version}"
    group = rootProject.maven_group
    base { archivesName = rootProject.archives_base_name }

    def root = rootProject.projectDir
    sourceSets {
        main {
            java.srcDirs = ["$root/src/common/java", "$root/src/${project.compat}/java", "$root/src/${project.extra}/java"]
            resources.srcDirs = ["$root/src/common/resources"]
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
        modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    }

    processResources {
        def props = [version: project.version, minecraft_dependency: project.minecraft_dependency]
        inputs.properties props
        filesMatching('fabric.mod.json') { expand props }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
        it.options.encoding = 'UTF-8'
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    loom {
        runs {
            client {
                programArgs '--username', 'AstroDev'
                runDir "../../run/${project.minecraft_version}"
            }
        }
    }
}

/** Builds every version and copies the jars into the launcher, which installs them into profiles. */
tasks.register('copyToLauncher', Copy) {
    dependsOn subprojects.collect { "${it.path}:remapJar" }
    from subprojects.collect { it.tasks.named('remapJar').flatMap { t -> t.archiveFile } }
    into "$rootDir/../launcher/resources/astro-mod"
}
